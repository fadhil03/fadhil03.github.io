<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Portfolio 2 — Ahmad Fadhil Kurniawan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #06060f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 480px; }
    .badge {
      display: inline-block;
      background: rgba(0,102,204,0.15);
      border: 1px solid rgba(0,102,204,0.35);
      color: #2997ff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 9999px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    p {
      color: rgba(255,255,255,0.5);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    a {
      display: inline-block;
      background: #0066cc;
      color: #fff;
      text-decoration: none;
      padding: 11px 24px;
      border-radius: 9999px;
      font-size: 15px;
      transition: background 0.2s;
    }
    a:hover { background: #0071e3; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Coming Soon</div>
    <h1>E-Portfolio 2</h1>
    <p>Halaman ini sedang dalam pengembangan.<br>Kembali ke portfolio pertama untuk melihat artefak PPL.</p>
    <a href="../eporto1/">← Kembali ke E-Portfolio 1</a>
  </div>
</body>
</html>
