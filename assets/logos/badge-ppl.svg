<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Outer ring background -->
  <circle cx="150" cy="150" r="148" fill="#2a9d8f"/>
  <!-- White separator ring -->
  <circle cx="150" cy="150" r="132" fill="white"/>
  <!-- Inner teal circle -->
  <circle cx="150" cy="150" r="118" fill="#2a9d8f"/>

  <!-- Top arc text: PPL SMKN 10 MAKASSAR -->
  <path id="topArc" d="M 35,150 A 115,115 0 0,1 265,150" fill="none"/>
  <text font-family="Arial Black, Arial, sans-serif" font-size="17" font-weight="900" fill="white" letter-spacing="2.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">PPL SMKN 10 MAKASSAR</textPath>
  </text>

  <!-- Bottom arc text: PPG INFORMATIKA UIM -->
  <path id="bottomArc" d="M 40,165 A 115,115 0 0,0 260,165" fill="none"/>
  <text font-family="Arial Black, Arial, sans-serif" font-size="15.5" font-weight="900" fill="white" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">★  PPG INFORMATIKA UIM  ★</textPath>
  </text>

  <!-- Open Book Icon (center) -->
  <g transform="translate(150,125) scale(0.82)" fill="white">
    <!-- Left page -->
    <path d="M0,-52 C-8,-48 -32,-38 -48,-28 L-48,42 C-32,32 -8,22 0,18 Z" opacity="0.95"/>
    <!-- Right page -->
    <path d="M0,-52 C8,-48 32,-38 48,-28 L48,42 C32,32 8,22 0,18 Z" opacity="0.95"/>
    <!-- Left inner lines (pages) -->
    <path d="M-6,-44 C-14,-40 -34,-30 -44,-22 L-44,36 C-34,28 -14,18 -6,14 Z" fill="#2a9d8f" opacity="0.5"/>
    <!-- Right inner lines -->
    <path d="M6,-44 C14,-40 34,-30 44,-22 L44,36 C34,28 14,18 6,14 Z" fill="#2a9d8f" opacity="0.5"/>
    <!-- Spine bottom point -->
    <path d="M-6,18 L0,30 L6,18 L0,22 Z"/>
    <!-- Top V crown -->
    <path d="M-12,-56 L0,-42 L12,-56 L8,-62 L0,-50 L-8,-62 Z"/>
  </g>

  <!-- Year 2026 -->
  <text x="150" y="206" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">2026</text>
</svg>
